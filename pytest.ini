[pytest]
# Test discovery paths
testpaths = tests

# Python path setup
pythonpath =
    digiworld
    digiworld/utils
    python-agent-to-app-interaction-api

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts = -v --tb=short

# Custom markers
markers =
    unit: marks tests as unit tests (no emulator required)
    integration: marks tests as integration tests (requires emulator)
    emulator: marks tests as requiring a connected emulator
    slow: marks tests as slow-running (may take minutes)
    instance_integrity: auto-discovered validation of scenarios and instances
    parallel: marks tests that run across multiple emulators in parallel
    xdist_group(name): assign test to a pytest-xdist load group

# Ignore patterns
norecursedirs =
    .git
    __pycache__
    node_modules
    apps
    *.egg-info

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_output.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s

# JUnit XML report
junit_family = xunit2

# Timeout for tests (requires pytest-timeout plugin)
# timeout = 300
