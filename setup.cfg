[flake8]
# Line length is black's job (the CI job always ignored E501). E203 and W503
# flag black's own output (space before ":" in slices, line break before a
# binary operator), so they are ignored to keep flake8 and black in agreement.
max-line-length = 88
extend-ignore = E203,W503,E501
exclude =
    .git,
    __pycache__,
    node_modules,
    *.egg-info,
    script_env
